<div class="pageBundle">
    <div class="page" id="play">
        <div id="playBackground"></div>
    </div>

    <div class="page" id="pause" data-layer="1">
        <div class="label headingLabel">ポーズ</div>
        <div class="container" data-direction="row">
            <div class="button" id="resumeButton" data-xy="[0,0]">再開する</div>
            <div class="restart button" id="pauseRestartButton" data-xy="[1,0]">もう一度</div>
            <div class="button" id="playPrepareButton" data-xy="[2,0]">プレイ準備</div>
        </div>
        <div class="container" data-direction="row">
            <div class="button" id="modeSelectButton" data-xy="[0,1]">モード選択</div>
            <div class="button" id="titleButton" data-xy="[1,1]">タイトルへ</div>
        </div>
    </div>

    <div class="page" id="startEffect" data-layer="1">
        <div id="startEffectBase"></div>
    </div>
</div>
