<div class="pageBundle">
    <div class="page" id="result">
        <div class="label headingLabel">結果画面</div>
        <div class="resultLabel label"></div>
        <div class="options" data-direction="row">
            <div class="restart button" id="resultRestartButton" data-xy="[0,0]">もう一度</div>
            <div class="button" id="resultPlayPrepareButton" data-xy="[1,0]">プレイ準備</div>
            <div class="button" id="resultModeSelectButton" data-xy="[2,0]">モード選択</div>
            <div class="button" data-xy="[3,0]" data-page="detailedResult">詳細結果</div>
        </div>
        <div class="options" data-direction="row">
            <div class="saveReplayButton button" data-xy="[1,1]">リプレイを保存する</div>
        </div>
        <div class="options" data-direction="row">
            <div class="button" id="resultTitleButton" data-xy="[1,2]">タイトルへ</div>
        </div>
    </div>

    <div class="page" id="replayResult">
        <div class="label headingLabel">結果画面</div>
        <div class="resultLabel label"></div>
        <div class="options" data-direction="row">
            <div class="replayStart button" id="replayRestartButton" data-xy="[0,0]">もう一度</div>
            <div class="button" id="replayListButton" data-xy="[1,0]">リプレイ一覧へ</div>
            <div class="button" id="replayResultTitleButton" data-xy="[2,0]">タイトルへ</div>
            <div class="button" data-xy="[3,0]" data-page="detailedResult">詳細結果</div>
        </div>
    </div>

    <div class="page" id="detailedResult">
        <div class="label headingLabel">詳細結果</div>
        <div class="subPageController">
            <div class="subPagePrev button" data-xy="[1,0]">前へ</div>
            <div class="label subPageLabel"></div>
            <div class="subPageNext button" data-xy="[2,0]">次へ</div>
        </div>
        <div class="back button" data-xy="[0,0]">戻る</div>
    </div>

    <div class="page" id="replaySaveAlert" data-layer="1">
        <div class="popup">
            <div class="label headingLabel">保存できません</div>
            <div class="text">
                すでに10件保存されているため<br />
                このリプレイを保存できません。<br />
                保存したリプレイでいずれかを削除してください。
            </div>
            <div class="back button" data-xy="[0,0]">戻る</div>
        </div>
    </div>

    <div class="page" id="replaySaveAlert2" data-layer="1">
        <div class="popup">
            <div class="label headingLabel">保存失敗</div>
            <div class="text">
                何らかの理由により保存に失敗しました。<br />
                保存容量やブラウザーの保存設定を確認してください。
            </div>
            <div class="back button" data-xy="[0,0]">戻る</div>
        </div>
    </div>
</div>
